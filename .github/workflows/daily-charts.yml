name: Generate Daily Charts

on:
  workflow_dispatch:
  schedule:
    - cron: "5 19 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate daily chart pages
        run: python scripts/generate-daily-charts.py

      - name: Commit generated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/

          if git diff --cached --quiet; then
            echo "No chart changes to commit."
          else
            git commit -m "Update daily charts"
            git push
          fi
